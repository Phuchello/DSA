name: DSA FlowLab CI

on:
  push:
    branches: [ dev/flowlab-p0, main ]
  pull_request:
    branches: [ dev/flowlab-p0, main ]

jobs:
  # ─────────────────────────────────────────────────────────────────────────────
  # Job 1: Build, unit tests, and native C++/GDB runtime tests on POSIX
  # ─────────────────────────────────────────────────────────────────────────────
  lint-and-unit-tests:
    name: Build, Full C++/GDB & Unit Tests (Linux/POSIX)
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: |
            package-lock.json
            client/package-lock.json
            server/package-lock.json

      - name: Install root dependencies
        run: npm ci

      - name: Install client dependencies
        working-directory: client
        run: npm ci

      - name: Install server dependencies
        working-directory: server
        run: npm ci

      - name: Type Check & Build Client
        working-directory: client
        run: npm run build

      - name: Run Client UI & Localization Tests (Vitest)
        working-directory: client
        run: npm test

      - name: Type Check & Build Server
        working-directory: server
        run: npm run build

      - name: Run DSA Normalizer & Pointer Classification Unit Tests
        run: node tests/normalizerUnitTests.js

      - name: Run M2.1 Educational Explanations Unit Tests
        run: node tests/educationalExplanationsTests.js

      - name: Install native Linux toolchain (g++ and GDB)
        run: |
          echo "nameserver 8.8.8.8" | sudo tee -a /etc/resolv.conf
          sudo apt-get update && sudo apt-get install -y g++ gdb

      - name: Run full native C++/GDB and process-tree regression suite (Linux/POSIX)
        run: npm test

  # ─────────────────────────────────────────────────────────────────────────────
  # Job 2: Full GDB integration tests and real Chrome smoke test. The Windows
  # hosted image includes Chrome; MSYS2 supplies the same g++/GDB toolchain used
  # by the native backend in this job.
  # ─────────────────────────────────────────────────────────────────────────────
  gdb-integration-tests:
    name: Full C++ & GDB Tests + Real Chrome Smoke (Windows)
    runs-on: windows-latest
    needs: lint-and-unit-tests
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: |
            package-lock.json
            client/package-lock.json
            server/package-lock.json

      - name: Install MSYS2 MinGW toolchain (g++ + gdb)
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          install: >-
            mingw-w64-x86_64-gcc
            mingw-w64-x86_64-gdb
            mingw-w64-x86_64-python
            mingw-w64-x86_64-python-pip

      - name: Add MinGW to PATH
        run: echo "C:\msys64\mingw64\bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Verify toolchain & Python GDB support
        run: |
          g++ --version
          gdb --version
          gdb -batch -ex 'python import sys; print("GDB Python version:", sys.version)'

      - name: Install root dependencies
        run: npm ci

      - name: Install client dependencies
        working-directory: client
        run: npm ci

      - name: Install server dependencies
        working-directory: server
        run: npm ci

      - name: Build server and client
        run: |
          cd server
          npm run build
          cd ../client
          npm run build

      - name: Run Full Automated Verification Suite
        env:
          FLOWLAB_GDB_TIMEOUT_STRESS_ROUNDS: '2'
          FLOWLAB_WINDOWS_JOB_STRESS_ROUNDS: '2'
        run: npm test

      - name: Configure real Chrome and browser evidence directory
        shell: pwsh
        run: |
          $chromePath = 'C:\Program Files\Google\Chrome\Application\chrome.exe'
          if (-not (Test-Path -LiteralPath $chromePath)) {
            throw "Expected preinstalled Chrome at $chromePath"
          }
          & $chromePath --version
          Add-Content -Path $env:GITHUB_ENV -Value "CHROME_PATH=$chromePath"
          $artifactRoot = Join-Path $env:RUNNER_TEMP 'flowlab-browser-smoke'
          New-Item -ItemType Directory -Force -Path (Join-Path $artifactRoot 'linked-list') | Out-Null
          New-Item -ItemType Directory -Force -Path (Join-Path $artifactRoot 'arrays') | Out-Null
          New-Item -ItemType Directory -Force -Path (Join-Path $artifactRoot 'recursion') | Out-Null
          New-Item -ItemType Directory -Force -Path (Join-Path $artifactRoot 'm2-1') | Out-Null
          New-Item -ItemType Directory -Force -Path (Join-Path $artifactRoot 'm2-2') | Out-Null
          New-Item -ItemType Directory -Force -Path (Join-Path $artifactRoot 'm2-3') | Out-Null
          New-Item -ItemType Directory -Force -Path (Join-Path $artifactRoot 'm2-4') | Out-Null
          $m23EvalDir = Join-Path $env:RUNNER_TEMP 'flowlab-m2-3-eval'
          New-Item -ItemType Directory -Force -Path $m23EvalDir | Out-Null
          Add-Content -Path $env:GITHUB_ENV -Value "FLOWLAB_M2_3_EVAL_ARTIFACT_DIR=$m23EvalDir"
          $m24EvidenceDir = Join-Path $env:RUNNER_TEMP 'flowlab-m2-4-evidence'
          New-Item -ItemType Directory -Force -Path $m24EvidenceDir | Out-Null
          Add-Content -Path $env:GITHUB_ENV -Value "FLOWLAB_M2_4_ARTIFACT_DIR=$m24EvidenceDir"

      - name: Run M2.3 evaluation benchmark (10 fixtures, 40 checkpoints)
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Continue'
          $logFile = Join-Path $env:FLOWLAB_M2_3_EVAL_ARTIFACT_DIR 'test-eval.log'
          npm run test:eval 2>&1 | Tee-Object -FilePath $logFile
          $evalExit = $LASTEXITCODE
          if (Test-Path 'docs/eval_results') {
            Copy-Item -Path 'docs/eval_results/*' -Destination $env:FLOWLAB_M2_3_EVAL_ARTIFACT_DIR -Force -ErrorAction SilentlyContinue
          }
          if ($evalExit -ne 0) {
            exit $evalExit
          }
          $r = Get-Content 'docs/eval_results/m2_3_evaluation_results.json' -Raw | ConvertFrom-Json
          $s = $r.rubricSummary
          $sum = [int]$s.CORRECT + [int]$s.GENERIC + [int]$s.UNSUPPORTED + [int]$s.PARTIAL + [int]$s.WRONG + [int]$s.UNKNOWN
          if ($r.fixturesCount -ne 10 -or $r.registeredCheckpointsCount -ne 40 -or $s.TOTAL -ne 40 -or $sum -ne 40) {
            throw "Inconsistent M2.3 evaluation totals: fixtures=$($r.fixturesCount), registered=$($r.registeredCheckpointsCount), total=$($s.TOTAL), sum=$sum"
          }
          if (-not $r.negativeControls.N1_step_limit.verified -or -not $r.negativeControls.N2_compile_error.verified) {
            throw "Mandatory negative control verification failed: N1=$($r.negativeControls.N1_step_limit.verified), N2=$($r.negativeControls.N2_compile_error.verified)"
          }
          Write-Host "Verified M2.3 evaluation totals: CORRECT=$($s.CORRECT), GENERIC=$($s.GENERIC), UNSUPPORTED=$($s.UNSUPPORTED), PARTIAL=$($s.PARTIAL), WRONG=$($s.WRONG), UNKNOWN=$($s.UNKNOWN), TOTAL=$($s.TOTAL)"

      - name: Run M2.3 adversarial evaluator corruption tests (11 checks)
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Continue'
          $logFile = Join-Path $env:FLOWLAB_M2_3_EVAL_ARTIFACT_DIR 'test-eval-corruption.log'
          npm run test:eval:corruption 2>&1 | Tee-Object -FilePath $logFile
          if ($LASTEXITCODE -ne 0) {
            exit $LASTEXITCODE
          }

      - name: Run linked-list Chrome browser smoke against native C++/GDB backend
        env:
          FLOWLAB_BROWSER_ARTIFACT_DIR: ${{ runner.temp }}/flowlab-browser-smoke/linked-list
        run: npm run test:browser

      - name: Run arrays & variables Chrome browser acceptance against native C++/GDB backend
        env:
          FLOWLAB_BROWSER_ARTIFACT_DIR: ${{ runner.temp }}/flowlab-browser-smoke/arrays
        run: npm run test:browser:array

      - name: Run recursion call stack Chrome browser acceptance against native C++/GDB backend
        env:
          FLOWLAB_BROWSER_ARTIFACT_DIR: ${{ runner.temp }}/flowlab-browser-smoke/recursion
        run: npm run test:browser:recursion

      - name: Run M2.1 educational explanations Chrome browser acceptance against native C++/GDB backend
        env:
          FLOWLAB_BROWSER_ARTIFACT_DIR: ${{ runner.temp }}/flowlab-browser-smoke/m2-1
        run: npm run test:browser:m2-1

      - name: Run M2.2 Beginner Learning Experience Chrome browser acceptance against native C++/GDB backend
        env:
          FLOWLAB_BROWSER_ARTIFACT_DIR: ${{ runner.temp }}/flowlab-browser-smoke/m2-2
        run: npm run test:browser:m2-2

      - name: Run M2.3 Generalization & Educational Accuracy Chrome browser acceptance against native C++/GDB backend
        shell: pwsh
        env:
          FLOWLAB_BROWSER_ARTIFACT_DIR: ${{ runner.temp }}/flowlab-browser-smoke/m2-3
        run: |
          $ErrorActionPreference = 'Continue'
          $logFile = Join-Path $env:FLOWLAB_M2_3_EVAL_ARTIFACT_DIR 'test-browser-m2-3.log'
          npm run test:browser:m2-3 2>&1 | Tee-Object -FilePath $logFile
          if ($LASTEXITCODE -ne 0) {
            exit $LASTEXITCODE
          }

      - name: Run M2.4 control-flow & native C++/GDB acceptance tests
        shell: pwsh
        env:
          M24_ARTIFACT_JSON: ${{ env.FLOWLAB_M2_4_ARTIFACT_DIR }}/m2_4_acceptance_results.json
        run: |
          $ErrorActionPreference = 'Continue'
          $logFile = Join-Path $env:FLOWLAB_M2_4_ARTIFACT_DIR 'test-m2-4.log'
          npm run test:m2-4 2>&1 | Tee-Object -FilePath $logFile
          if ($LASTEXITCODE -ne 0) {
            exit $LASTEXITCODE
          }
          if (-not (Test-Path -LiteralPath $env:M24_ARTIFACT_JSON)) {
            throw "Expected M2.4 native acceptance JSON artifact at $($env:M24_ARTIFACT_JSON)"
          }

      - name: Run M2.4 Control Flow Clarity Chrome browser acceptance against native C++/GDB backend
        shell: pwsh
        env:
          FLOWLAB_BROWSER_M24_ARTIFACT_DIR: ${{ runner.temp }}/flowlab-browser-smoke/m2-4
        run: |
          $ErrorActionPreference = 'Continue'
          $logFile = Join-Path $env:FLOWLAB_M2_4_ARTIFACT_DIR 'test-browser-m2-4.log'
          npm run test:browser:m2-4 2>&1 | Tee-Object -FilePath $logFile
          if ($LASTEXITCODE -ne 0) {
            exit $LASTEXITCODE
          }

      - name: Preserve real browser logs and screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: browser-smoke-evidence-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/flowlab-browser-smoke/
          if-no-files-found: error
          retention-days: 14

      - name: Preserve M2.3 evaluation results, logs, and screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: m2-3-evaluation-evidence-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/flowlab-m2-3-eval/
            ${{ runner.temp }}/flowlab-browser-smoke/m2-3/
          if-no-files-found: warn
          retention-days: 14

      - name: Preserve M2.4 native logs, trace evidence, and Chrome screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: m2-4-evidence-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/flowlab-m2-4-evidence/
            ${{ runner.temp }}/flowlab-browser-smoke/m2-4/
          if-no-files-found: warn
          retention-days: 14
